name: Release

# Builds the APK and publishes it as a GitHub release (Obtainium tracks these). Either push a tag
# like v0.6.1, or use "Run workflow" on the Actions tab: that tags the current commit with the
# versionName from AndroidManifest.xml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner zipalign dalvik-exchange android-sdk-platform-23

      - name: Cache Android framework jar
        uses: actions/cache@v4
        with:
          path: sdk
          key: android-all-16-robolectric-13921718

      # Every release must be signed with the same key or Android refuses the update.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the KEYSTORE_B64 repository secret (base64 of debug.keystore)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > debug.keystore

      - name: Build
        run: sh build.sh

      - name: Work out the release tag
        run: |
          version=$(aapt dump badging n6-fold-duo.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if [ "v$version" != "$tag" ]; then
              echo "::error::Tag $tag doesn't match versionName $version in AndroidManifest.xml."
              exit 1
            fi
          else
            tag="v$version"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump versionName/versionCode in AndroidManifest.xml first."
            exit 1
          fi
          gh release create "$TAG" n6-fold-duo.apk --target "$GITHUB_SHA" --title "N6 Fold Duo ${TAG#v}" --generate-notes
